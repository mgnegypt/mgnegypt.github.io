<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>try{var t=localStorage.t||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<title>بلدينو — خدمات بلدك.. أقرب ليك</title>
<meta name="description" content="خدمة على بلدينو — افتحها في التطبيق أو نزّل التطبيق عشان تشوف التفاصيل.">
<meta property="og:title" content="بلدينو — خدمات بلدك.. أقرب ليك">
<meta property="og:description" content="خدمة على بلدينو — افتحها في التطبيق أو نزّل التطبيق عشان تشوف التفاصيل.">
<meta property="og:image" content="https://mgnegypt.github.io/logo.png">
<meta property="og:type" content="website">
</head>
<body>
<nav><div class="wrap"><a class="brand" href="/"><img src="/assets/logo.svg" alt="">بلدينو</a>
<button class="ic" id="th" aria-label="تبديل الوضع الليلي"><svg viewBox="0 0 24 24"><path d="M20 14a8 8 0 1 1-10-10 7 7 0 0 0 10 10z"/></svg></button>
<a class="btn" href="https://github.com/mgnegypt/baladeno-releases/releases/latest">نزّل التطبيق</a></div></nav>
<main class="sv">
<article class="card">
<div class="cv" id="cv"><img id="cover" alt=""><span class="eyes"><span class="eye"><i></i></span><span class="eye"><i></i></span></span></div>
<h1 id="title">خدمة على بلدينو</h1>
<p class="ct" id="category"></p>
<p class="nt" id="status">بنحمّل بيانات الخدمة…</p>
<a class="btn" id="openApp" href="#">افتح في التطبيق</a>
<a class="btn alt" href="https://github.com/mgnegypt/baladeno-releases/releases/latest">نزّل التطبيق</a>
</article>
</main>
<script src="/assets/app.js"></script>
<script>
(function () {
  var parts = location.pathname.split("/").filter(function (p) { return p.length > 0; });
  if (parts[0] === "invite" && parts[1]) {
    document.getElementById("title").textContent = "اتدعيت لبلدينو";
    status.textContent = "حد من بلدك دعاك تنزّل بلدينو. افتح الدعوة في التطبيق لو عندك، أو نزّل التطبيق وارجع افتح الرابط تاني.";
    img.src = "/assets/logo.svg"; cv.className = "cv no";
    openBtn.href = "baladeno://invite/" + encodeURIComponent(parts[1]);
    openBtn.addEventListener("click", function () {
      setTimeout(function () {
        if (!document.hidden) status.textContent = "لو التطبيق مفتحش، نزّله من الزرار اللي تحت وافتح رابط الدعوة تاني.";
      }, 2000);
    });
    return;
  }
  var id = (parts[0] === "service" && parts[1]) ? parts[1] : null;
  var status = document.getElementById("status");
  var openBtn = document.getElementById("openApp");
  var cv = document.getElementById("cv");
  var img = document.getElementById("cover");
  function fail(t, s) {
    document.getElementById("title").textContent = t;
    status.textContent = s;
    img.src = "/assets/logo.svg"; cv.className = "cv no";
  }
  if (!id) {
    fail("الرابط مش مظبوط", "افتح التطبيق ودوّر على الخدمة من جوّه.");
    openBtn.style.display = "none";
    return;
  }
  openBtn.href = "baladeno://service/" + encodeURIComponent(id);
  openBtn.addEventListener("click", function () {
    setTimeout(function () {
      if (!document.hidden) status.textContent = "لو التطبيق مفتحش، نزّله من الزرار اللي تحت وافتح الرابط تاني.";
    }, 2000);
  });
  fetch("https://mzahqbwutcmfxdtyiihr.supabase.co/functions/v1/service-preview?id=" + encodeURIComponent(id))
    .then(function (r) { if (!r.ok) throw new Error("nf"); return r.json(); })
    .then(function (s) {
      document.title = s.title + " — بلدينو";
      document.getElementById("title").textContent = s.title;
      if (s.category) document.getElementById("category").textContent = s.category;
      if (s.image) { img.onload = function () { cv.className = "cv ok"; }; img.src = s.image; }
      else { img.src = "/assets/logo.svg"; cv.className = "cv no"; }
      status.textContent = "دي خدمة على بلدينو. افتحها في التطبيق عشان تشوف التفاصيل وبيانات التواصل.";
    })
    .catch(function () {
      fail("الخدمة مش موجودة", "الخدمة دي مش متاحة دلوقتي، يمكن اتشالت. افتح التطبيق ودوّر على خدمات تانية قريبة منك.");
    });
})();
</script>
</body>
</html>
